<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biryani On-The-Go | Menu</title>

<link rel="icon" type="image/png" href="logo.png">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Restaurant",
  "name": "Biryani On-The-Go",
  "url": "https://www.biryanionthego.in",
  "logo": "https://www.biryanionthego.in/logo.png",
  "telephone": "+91-9034270968",
  "priceRange": "₹₹",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "260, New Mandi Township, near Shiva Hardware",
    "addressLocality": "Ambala",
    "addressRegion": "Haryana",
    "addressCountry": "IN"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 30.3691243,
    "longitude": 76.7718996
  }
}
</script>

<style>
:root {
  --orange:#e36a1c;
  --dark-brown:#5a2a0c;
  --light-bg:#fff8f1;
}

body {
  margin:0;
  font-family:"Segoe UI", Arial, sans-serif;
  background:var(--light-bg);
  color:#333;
  scroll-behavior:smooth;
}

/* HEADER */
header {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;
  background:#fff;
  border-bottom:4px solid var(--orange);
}

.header-inner {
  max-width:1100px;
  margin:auto;
  padding:6px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand {
  display:flex;
  align-items:center;
  gap:20px;
}

header img {
  max-width:150px;
}

.tagline {
  font-weight:bold;
  color:var(--dark-brown);
}

nav a {
  margin-left:28px;
  text-decoration:none;
  font-weight:600;
  color:var(--dark-brown);
}

nav a.active {
  color:var(--orange);
  border-bottom:3px solid var(--orange);
}

/* CONTENT */
section {
  max-width:1000px;
  margin:auto;
  padding:35px 15px;
}

h2 {
  text-align:center;
  color:var(--dark-brown);
}

.menu-item {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed #ddd;
}

.sub-item {
  margin-left:15px;
}

.price {
  color:#000;
}
</style>
</head>

<body>

<header id="siteHeader">
  <div class="header-inner">
    <div class="brand">
      <img src="logo.png" alt="Biryani On-The-Go Logo">
      <div class="tagline">Authentic Flavour, Anytime!</div>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="Menu.html" class="active">Menu</a>
    </nav>
  </div>
</header>

<section>

<h2>Biryani</h2>
<div class="menu-item">
  <span><strong>Dum Veg Biryani</strong></span>
  <span class="price"><strong><em>₹99</em></strong></span>
</div>
<div class="menu-item">
  <span><strong>Dum Chicken Biryani</strong></span>
  <span class="price"><strong><em>₹199</em></strong></span>
</div>

</section>

<script>
/* FIX HEADER OVERLAP */
function adjustBodyPadding() {
  const header = document.getElementById("siteHeader");
  document.body.style.paddingTop = header.offsetHeight + "px";
}
window.addEventListener("load", adjustBodyPadding);
window.addEventListener("resize", adjustBodyPadding);
</script>

</body>
</html>
